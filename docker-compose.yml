version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: zhilianbiji-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: zhilianbiji
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: zhilianbiji-redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # 后端服务
  backend:
    build: ./backend
    container_name: zhilianbiji-backend
    restart: always
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://admin:123456@mysql:3306/zhilianbiji?charset=utf8mb4
      JWT_SECRET_KEY: jwt-secret-key-change-in-production
      SECRET_KEY: dev-secret-key-change-in-production
    volumes:
      - ./backend/static/uploads:/app/static/uploads
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 前端服务
  frontend:
    build: ./frontend
    container_name: zhilianbiji-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

# 数据卷
volumes:
  mysql_data:
  redis_data:
